<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nook V1.0</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="topbar">
        <div class="brand">
            <h1>Nook</h1>
            <span>Your little space.</span>
        </div>

        <div class="toolbar">
            <button id="add-card">+ New Card</button>
        </div>
    </header>

    <main id="workspace">
        <div class="welcome">
            <h2>Your space...</h2>
            <p>Start by adding something to your Nook</p>
        </div>
    </main>

</body>

</html>
