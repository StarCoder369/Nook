<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nook</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <h1>Nook</h1>
                <span>Your little space.</span>
            </div>

            <div class="sidebar-tools">
                <button id="add-card">+ New card</button>
            </div>

            <div class="sidebar-footer">
                <span>Made for the Hack Club ysws: Hideout</span>
            </div>
        </aside>

        <main id="workspace">
            <div id="canvas">
                <div class="welcome">
                    <h2>Your Nook</h2>
                    <p>Start by adding something to your Nook.</p>
                </div>
            </div>
        </main>

    </div>

</body>

</html>
